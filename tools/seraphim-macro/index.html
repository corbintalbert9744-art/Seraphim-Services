<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seraphim Macro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>SERAPHIM MACRO</h1>
      <p id="licenseInfo" class="subtitle">Licensed</p>
    </div>
    <div class="status-pill" id="engineStatus">Engine idle</div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Macro Profile</h2>
      <label>Name<input id="profileName" value="Default Macro" /></label>
      <label>Keys to send<input id="profileKeys" value="{ENTER}" /></label>
      <label>Loops<input id="profileLoops" type="number" min="1" value="3" /></label>
      <label>Delay (ms)<input id="profileDelay" type="number" min="0" value="100" /></label>
      <div class="actions">
        <button id="startBtn" class="primary">Start Macro</button>
        <button id="stopBtn">Stop</button>
      </div>
    </section>

    <section class="panel log-panel">
      <h2>Engine Log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
