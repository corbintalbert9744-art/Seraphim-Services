<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activate Seraphim Macro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="license-page">
  <main class="card">
    <h1>SERAPHIM MACRO</h1>
    <p class="subtitle">Enter your license key to activate</p>
    <input id="licenseInput" type="text" placeholder="SRPH-XXXXXX-XXXXXX-XXXXXX-XXXXXX" spellcheck="false" />
    <p id="error" class="error hidden"></p>
    <button id="activateBtn">Activate</button>
    <p class="hint">Keys are generated in Seraphim Keyboard Macro admin panel v1.2.0+</p>
  </main>
  <script src="license-renderer.js"></script>
</body>
</html>
