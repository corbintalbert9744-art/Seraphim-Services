<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seraphim Admin Panel</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>SERAPHIM<br>ADMIN PANEL</h1>
      </div>
      <nav id="nav" class="nav"></nav>
    </aside>

    <div class="main">
      <div class="titlebar">
        <div class="window-dots">
          <span class="dot yellow"></span>
          <span class="dot orange"></span>
          <span class="dot red"></span>
        </div>
      </div>

      <div class="content">
        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">TOTAL KEYS</div>
            <div id="statTotal" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">ACTIVE KEYS</div>
            <div id="statActive" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">USED DEVICES</div>
            <div id="statDevices" class="stat-value">0</div>
          </div>
        </div>

        <div class="section-header">
          <h2 id="sectionTitle" class="section-title">ALL LICENSE KEYS</h2>
          <button id="createBtn" class="btn-create" type="button">+ CREATE KEY</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>LICENSE KEY</th>
                <th>PRODUCT</th>
                <th>USER</th>
                <th>STATUS</th>
                <th>DEVICES</th>
                <th>CREATED</th>
                <th>EXPIRES</th>
                <th>LAST USED</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Create License Key</h2>
        <button id="modalClose" class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="productSelect">PRODUCT</label>
          <select id="productSelect" class="product-select"></select>
          <p class="hint">Which app this key will work with</p>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="maxDevicesSelect">MAX DEVICES</label>
            <select id="maxDevicesSelect"></select>
            <p class="hint">Number of devices this key can activate</p>
          </div>
          <div class="field">
            <label for="durationSelect">DURATION</label>
            <select id="durationSelect"></select>
            <p class="hint">How long the key remains valid</p>
          </div>
        </div>
        <div class="field">
          <label for="noteInput">NOTE (OPTIONAL)</label>
          <textarea id="noteInput" placeholder="e.g., Customer name or order ID"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelBtn" class="btn-cancel" type="button">CANCEL</button>
        <button id="generateBtn" class="btn-generate" type="button">GENERATE KEY</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
